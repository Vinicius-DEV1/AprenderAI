services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aprovado-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - production-network

  # Nginx Webserver
  webserver:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - production-network

  # Database (Internal Only)
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - production-db-data:/var/lib/mysql
    networks:
      - production-network
    # DB is NOT exposed to the public internet

networks:
  production-network:
    driver: bridge

volumes:
  production-db-data:
    driver: local
