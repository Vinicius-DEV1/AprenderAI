name: aprender-ai
services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: php-app
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - ./qdrant-data:/var/www/qdrant-backup:ro
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - production-network
    # ----------------------------------------------------------------
    # HEALTHCHECK — Verifica se o PHP-FPM concluiu toda a inicialização.
    # O sentinel /tmp/app_ready é criado pelo docker-entrypoint.sh APÓS:
    #   1. Migrações concluídas
    #   2. Cache otimizado (optimize)
    #   3. PHP-FPM pronto para aceitar conexões
    # O webserver usa condition: service_healthy — NUNCA recebe tráfego
    # antes deste check passar. Isso elimina os 500/502 durante deploy.
    # ----------------------------------------------------------------
    healthcheck:
      test: "test -f /tmp/app_ready || exit 1"
      interval: 5s
      timeout: 3s
      retries: 80        # até 400s de espera total
      start_period: 20s  # aguarda o processo PHP iniciar antes do primeiro teste
    deploy:
      resources:
        limits:
          memory: 512M

  # Nginx Webserver (Custom Image with assets)
  webserver:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: nginx
    image: aprender-ai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      app:
        # IMPORTANTE: service_healthy garante que o nginx SÓ inicia quando o
        # PHP-FPM estiver COMPLETAMENTE pronto (migrate + optimize + sentinel).
        # Era service_started — isso causava os 502/500 durante deploy.
        condition: service_healthy
    networks:
      - production-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - production-network

  # PHP Queue Worker
  worker:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - ./qdrant-data:/var/www/qdrant-backup:ro
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    # Prioriza explicitamente a fila 'default' (Simulados/Chats), 'essays' (Redações) e depois a 'import'.
    command: php artisan queue:work --queue=search_embeddings,default,essays --sleep=3 --tries=3 --max-time=3600
    deploy:
      replicas: 40
      resources:
        limits:
          memory: 512M # Mantido em 512M conforme solicitado
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - production-network

  # AI Triage Worker (Para processamento de lotes e classificações LLM)
  # ESCALA: 1 réplica (Sequential processing for stability)
  ai-triage-worker:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - ./qdrant-data:/var/www/qdrant-backup:ro
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    # Queue 'ai_triage' handle batches and 'import' handles ZIP extractions
    command: php artisan queue:work --queue=ai_triage,import --sleep=3 --tries=3 --timeout=700 --max-time=3600
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - production-network

  # AI Embeddings Worker (Para indexação e geração de vetores)
  # ESCALA: 3 réplicas
  ai-embeddings-worker:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - ./qdrant-data:/var/www/qdrant-backup:ro
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan queue:work --queue=embeddings --sleep=10 --tries=3 --timeout=120 --max-time=3600
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - production-network

  # PHP Scheduler
  scheduler:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # Sync de Concursos (Recorrente: 2 em 2 horas)
  concursos-sync:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: sh -c "while :; do php artisan concursos:sync; sleep 7200; done"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network
    deploy:
      resources:
        limits:
          memory: 256M

  # Database (Internal Only)
  db:
    image: mysql:8.0
    restart: always
    # env_file injeta todas as variáveis do .env do Laravel no container.
    # O bloco `environment` abaixo "traduz" os nomes do Laravel para os
    # nomes que o MySQL espera (MYSQL_*). Ambos precisam estar presentes.
    env_file: ./backend/.env
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_HOST: '%'
    volumes:
      - ./mysql-data:/var/lib/mysql
    # ----------------------------------------------------------------
    # Healthcheck: Docker marks the container healthy only AFTER MySQL
    # is actually accepting connections — not just when the process start.
    # This is what `condition: service_healthy` waits for above.
    # ----------------------------------------------------------------
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - production-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - production-network

  # Vector Database for Semantic Search
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333" # Opcional: exposto para gerenciamento externo se necessário
    volumes:
      - ./qdrant-data:/qdrant/storage
    networks:
      - production-network

networks:
  production-network:
    driver: bridge


