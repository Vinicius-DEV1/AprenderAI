services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: aprovado-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file: .env
    networks:
      - production-network

  # Nginx Webserver
  webserver:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - production-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - production-network

  # PHP Worker
  worker:
    image: aprovado-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file: .env
    command: php artisan queue:work
    depends_on:
      - app
      - db
    networks:
      - production-network

  # PHP Scheduler
  scheduler:
    image: aprovado-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file: .env
    command: php artisan schedule:work
    depends_on:
      - app
      - db
    networks:
      - production-network

  # Database (Internal Only)

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - production-db-data:/var/lib/mysql
    networks:
      - production-network

networks:
  production-network:
    driver: bridge

volumes:
  production-db-data:
    driver: local

