services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    # ----------------------------------------------------------------
    # app MUST wait for db to be HEALTHY (not just started).
    # Without this, php-fpm launches before MySQL is ready,
    # migrations fail, and the entrypoint exits → 502 Bad Gateway.
    # ----------------------------------------------------------------
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # Nginx Webserver
  webserver:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Wait for app to be healthy before nginx starts serving
    depends_on:
      app:
        condition: service_started
    networks:
      - production-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - production-network

  # PHP Queue Worker
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    # Prioriza explicitamente a fila 'default' (Simulados/Chats) e depois a 'import'
    command: php artisan queue:work --queue=default,import --sleep=3 --tries=3 --max-time=3600
    deploy:
      replicas: 10
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # PHP Scheduler
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    env_file: ./backend/.env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # Database (Internal Only)
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - production-db-data:/var/lib/mysql
    # ----------------------------------------------------------------
    # Healthcheck: Docker marks the container healthy only AFTER MySQL
    # is actually accepting connections — not just when the process start.
    # This is what `condition: service_healthy` waits for above.
    # ----------------------------------------------------------------
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - production-network

  # Redis for Sessions and Cache
  redis:
    image: redis:alpine
    restart: always
    networks:
      - production-network

networks:
  production-network:
    driver: bridge

volumes:
  production-db-data:
    driver: local
