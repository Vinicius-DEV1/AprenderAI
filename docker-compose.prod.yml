name: aprender-ai
services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: php-app
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # Nginx Webserver (Custom Image with assets)
  webserver:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      target: nginx
    image: aprender-ai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      app:
        condition: service_started
    networks:
      - production-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - production-network

  # PHP Queue Worker
  worker:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    # Prioriza explicitamente a fila 'default' (Simulados/Chats), 'essays' (Redações) e depois a 'import'
    command: php artisan queue:work --queue=default,essays,import --sleep=3 --tries=3 --max-time=3600
    deploy:
      replicas: 50
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # AI Dedicated Queue Worker
  ai-worker:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    # Fila exclusiva para triagem em lote do Xavier (evita travar o sistema principal)
    command: php artisan queue:work --queue=ai-batches --sleep=3 --tries=1 --timeout=700 --max-time=3600
    deploy:
      replicas: 2
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # PHP Scheduler
  scheduler:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # Sync de Concursos (Recorrente: 2 em 2 horas)
  concursos-sync:
    image: aprender-ai-app
    restart: always
    working_dir: /var/www
    volumes:
      - ./backend/storage/app/public:/var/www/storage/app/public
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: sh -c "while :; do php artisan concursos:sync; sleep 7200; done"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - production-network

  # Database (Internal Only)
  db:
    image: mysql:8.0
    restart: always
    # env_file injeta todas as variáveis do .env do Laravel no container.
    # O bloco `environment` abaixo "traduz" os nomes do Laravel para os
    # nomes que o MySQL espera (MYSQL_*). Ambos precisam estar presentes.
    env_file: ./backend/.env
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_HOST: '%'
    volumes:
      - production-db-data:/var/lib/mysql
    # ----------------------------------------------------------------
    # Healthcheck: Docker marks the container healthy only AFTER MySQL
    # is actually accepting connections — not just when the process start.
    # This is what `condition: service_healthy` waits for above.
    # ----------------------------------------------------------------
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - production-network

  # Redis for Sessions and Cache
  redis:
    image: redis:alpine
    restart: always
    networks:
      - production-network

networks:
  production-network:
    driver: bridge

volumes:
  production-db-data:
    driver: local
