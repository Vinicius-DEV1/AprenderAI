name: aprender-ai

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
      args:
        user: developer
        uid: 1000
    image: aprender-ai-local
    container_name: aprender-ai-app
    volumes:
      - ./backend:/var/www
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - local-network

  redis:
    image: redis:alpine
    container_name: aprender-ai-redis
    networks:
      - local-network

  webserver:
    image: nginx:stable-alpine
    container_name: aprender-ai-webserver
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - local-network

  db:
    image: mysql:8.0
    container_name: aprender-ai-db
    command: --default-authentication-plugin=mysql_native_password --skip-name-resolve
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: aprenderai
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: admin
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - local-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=180
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network
    deploy:
      replicas: 2

  # ── Embeddings Worker (Semantic Search indexing queue) ──────────────────
  embeddings-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-embeddings-worker
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan queue:work --queue=embeddings --sleep=5 --tries=2 --timeout=120
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - local-network
    deploy:
      replicas: 1

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan queue:work --queue=essays,ai_triage,import --sleep=3 --tries=3 --timeout=700
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network
    deploy:
      replicas: 1

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network

  # ── Qdrant Vector Database ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aprender-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - local-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-frontend
    restart: on-failure
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - aprender-ai-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    networks:
      - local-network
    command: npm run dev -- --host
    depends_on:
      - app

networks:
  local-network:
    driver: bridge

volumes:
  local-db-data:
    driver: local
  aprender-ai-node-modules:
    driver: local
  qdrant-data:
    driver: local
