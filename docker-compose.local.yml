services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
      args:
        user: developer
        uid: 1000
    image: aprender-ai-local
    container_name: aprender-ai-app
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    # environment:
    #   - APP_NAME=aprenderAI
    #   - APP_ENV=local
    #   - APP_KEY=base64:cwLoa7etFk8s4DQ8goS72l6OyFF41/Qwy84zfacp5xs=
    #   - APP_DEBUG=true
    #   - APP_URL=http://localhost:8000
    #   - FRONTEND_URL=http://localhost:5174
    #   - DB_CONNECTION=mysql
    #   - DB_HOST=db
    #   - DB_PORT=3306
    #   - DB_DATABASE=aprenderai
    #   - DB_USERNAME=admin
    #   - DB_PASSWORD=secret
    #   - REDIS_HOST=redis
    #   - SESSION_DRIVER=redis
    #   - CACHE_STORE=redis
    #   - SESSION_SECURE_COOKIE=false
    #   - SESSION_SAME_SITE=lax
    #   - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:5174,127.0.0.1,127.0.0.1:5174,localhost:8000,127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - local-network

  redis:
    image: redis:alpine
    container_name: aprender-ai-redis
    networks:
      - local-network

  webserver:
    image: nginx:stable-alpine
    container_name: aprender-ai-webserver
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.local.conf:/etc/nginx/conf.d/default.conf # <--  nginx.local.conf
    depends_on:
      - app
    networks:
      - local-network

  db:
    image: mysql:8.0
    container_name: aprender-ai-db
    command: --default-authentication-plugin=mysql_native_password --skip-name-resolve
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: aprenderai
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: admin
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      # Usa root para evitar race condition de criação do MYSQL_USER
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret" ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - local-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor # volume anônimo: evita bind-mount apagar o vendor
      - /proc:/host_proc:ro
    environment:
      - APP_NAME=aprenderAI
      - APP_ENV=local
      - APP_KEY=base64:cwLoa7etFk8s4DQ8goS72l6OyFF41/Qwy84zfacp5xs=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=aprenderai
      - DB_USERNAME=admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --queue=default,import --sleep=3 --tries=3 --timeout=180
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network
    deploy:
      replicas: 2

  ai-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /proc:/host_proc:ro
    environment:
      - APP_NAME=aprenderAI
      - APP_ENV=local
      - APP_KEY=base64:cwLoa7etFk8s4DQ8goS72l6OyFF41/Qwy84zfacp5xs=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=aprenderai
      - DB_USERNAME=admin
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --queue=ai-batches --sleep=3 --tries=3 --timeout=360
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network
    deploy:
      replicas: 1

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    restart: unless-stopped
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /proc:/host_proc:ro
    env_file: ./backend/.env
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-frontend
    restart: on-failure
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules # volume anônimo: protege node_modules do bind-mount
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
      # Fix para WSL2/Windows: Vite EIO crash no file-watching via bind mount
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    networks:
      - local-network
    command: npm run dev -- --host
    depends_on:
      - app

networks:
  local-network:
    driver: bridge

volumes:
  local-db-data:
    driver: local
