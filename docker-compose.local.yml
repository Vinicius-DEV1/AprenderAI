version: '3'
services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-app
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
      - /proc:/host_proc:ro
    networks:
      - local-network
    environment:
      - INITIALIZE_APP=true
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:alpine
    container_name: aprender-ai-redis
    networks:
      - local-network

  webserver:
    image: nginx:alpine
    container_name: aprender-ai-webserver
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.local.conf:/etc/nginx/conf.d/default.conf
    networks:
      - local-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: aprender-ai-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aprenderai}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - original_db_data:/var/lib/mysql
    networks:
      - local-network
    command: --default-authentication-plugin=mysql_native_password --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: aprender-ai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - local-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - local-network
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-worker
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
      - /proc:/host_proc:ro
    networks:
      - local-network
    env_file: ./backend/.env
    depends_on:
      - app
      - redis
      - db

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: aprender-ai-scheduler
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www
      - vendor_volume:/var/www/vendor
      - /proc:/host_proc:ro
    networks:
      - local-network
    env_file: ./backend/.env
    depends_on:
      - app
      - redis
      - db

networks:
  local-network:
    driver: bridge

volumes:
  original_db_data:
    external: true
    name: aprender-ai_local-db-data
  qdrant_storage:
  vendor_volume:
