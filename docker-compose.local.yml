services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        user: developer
        uid: 1000
    image: aprovado-ai-local
    container_name: aprovado-ai-app
    volumes:
      - .:/var/www
    environment:
      - APP_NAME=aprenderAI
      - APP_ENV=local
      - APP_KEY=base64:cwLoa7etFk8s4DQ8goS72l6OyFF41/Qwy84zfacp5xs=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5174
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=aprenderai
      - DB_USERNAME=admin
      - DB_PASSWORD=secret
      - SESSION_DRIVER=database
      - CACHE_STORE=file
      - SESSION_SECURE_COOKIE=false
      - SESSION_SAME_SITE=lax
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:5174,127.0.0.1,127.0.0.1:5174,localhost:8000,127.0.0.1:8000
    # env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - local-network

  webserver:
    image: nginx:stable-alpine
    container_name: aprovado-ai-webserver
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf # <--  nginx.local.conf
    depends_on:
      - app
    networks:
      - local-network

  db:
    image: mysql:8.0
    container_name: aprovado-ai-db
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aprovado_ai}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-root}
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - local-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: aprovado-ai-worker
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file: .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - local-network
    deploy:
      replicas: 1

networks:
  local-network:
    driver: bridge

volumes:
  local-db-data:
    driver: local
