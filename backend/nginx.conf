server {
    listen 80;
    server_name aprenderai.com.br www.aprenderai.com.br;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aprenderai.com.br www.aprenderai.com.br;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/aprenderai.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aprenderai.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/public;
    index index.html index.php;

    client_max_body_size 200M;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -----------------------------------------------------------------------
    # REGRA 1: Streaming de IA (SSE/chunked) — sem buffer
    # -----------------------------------------------------------------------
    location ~ /chat/stream$ {
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 86400s;
        proxy_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        fastcgi_keep_conn on;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # -----------------------------------------------------------------------
    # REGRA 2: index.html — NUNCA deve ser cacheado pelo browser ou proxy.
    # Isso e critico para SPAs: apos um deploy, o browser DEVE buscar o HTML
    # mais recente, que aponta para os novos arquivos JS/CSS com hash.
    # Se o index.html for cacheado, o browser tentara carregar arquivos
    # JS/CSS com hashes antigos que nao existem mais -> Tela branca.
    # -----------------------------------------------------------------------
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # REGRA 3: Arquivos JS e CSS com HASH (gerados pelo Vite).
    # Ex: index-BNth7pJI.js, index-BOvP4ij1.css
    # Sao IMUTAVEIS: se o conteudo mudar, o hash muda. Cache forever.
    # try_files =404 garante que arquivos antigos retornam 404 real
    # (sem fallback para index.html, sem erro de MIME type).
    # -----------------------------------------------------------------------
    location ~* \.(js|css|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # REGRA 4: Outros assets estaticos (imagens, fontes, etc.)
    # Podem ser cacheados por 6 meses, sem `immutable`.
    # -----------------------------------------------------------------------
    location ~* \.(jpe?g|gif|png|ico|woff2?|eot|ttf|svg|mp4|webm)$ {
        try_files $uri =404;
        expires 6M;
        add_header Cache-Control "public, max-age=15552000";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # REGRA EXTRA: Servir Storage Dir diretamente via Alias (Previne erros de symlink no docker)
    # -----------------------------------------------------------------------
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        add_header Cache-Control "public, max-age=15552000";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # REGRA 5: Rotas da API Laravel (/api/) e Sanctum (/sanctum/)
    # DEVEM ir pro PHP-FPM via index.php — NUNCA para o SPA.
    # O ^~ garante que essa regra tem prioridade sobre a REGRA 6 (location /).
    # -----------------------------------------------------------------------
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Google OAuth redirect e callback (web.php — sem prefixo /api/)
    location ^~ /auth/ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Webhooks (Asaas, etc.) — sem prefixo /api/
    location ^~ /webhooks/ {
        try_files $uri /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Sitemap
    location = /sitemap.xml {
        try_files $uri /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # -----------------------------------------------------------------------
    # REGRA 6: PHP — acesso direto a arquivos .php (ex: index.php)
    # -----------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # -----------------------------------------------------------------------
    # REGRA 7: SPA Fallback — rotas React (/dashboard, /admin, /login, etc.)
    # Serve o index.html que está sob a REGRA 2 (no-store).
    # APIs nunca chegam aqui por causa das REGRAS 5 e 6 acima.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        gzip_static on;
    }

    # Security: Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}
