server {
    listen 80;
    server_name aprenderai.com.br www.aprenderai.com.br;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aprenderai.com.br www.aprenderai.com.br;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/aprenderai.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aprenderai.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/public;
    index index.html index.php;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SSE Support para rotas do Xavier Chat
    location ~ /chat/stream$ {
        # O Segredo do Streaming: desabilitar buffers
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 86400s;
        proxy_buffering off;

        # Desliga gzip para não reter blocos no compressor
        gzip off;
        chunked_transfer_encoding on;
        fastcgi_keep_conn on;

        # Envia diretamente para o index.php do Laravel
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # Security: Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}

