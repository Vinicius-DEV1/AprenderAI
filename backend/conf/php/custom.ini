[PHP]
; Limite de memória aumentado para suportar extração de ZIPs grandes em memória
memory_limit = 1G

; Limite de upload aumentado para suportar arquivos de até 10GB
; NOTA: upload_max_filesize DEVE ser <= post_max_size
upload_max_filesize = 10G
post_max_size = 10G

; Tempo máximo de execução estendido para 2 horas (7200s)
; Necessário para extração e processamento de ZIPs grandes
max_execution_time = 7200
max_input_time = 7200


[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.validate_timestamps = 0
